[honeyprintAlert]
# Python script to execute
alert.execute.cmd = honeyprintAlert.py

# Make alert action visible in UI
is_custom = 1

# Label shown in UI
label = Honeyprint Alert

# Description
description = Send alert data to Honeyprint fingerprint system with configurable field extraction

# Icon (optional - uses default if not specified)
icon_path = alert_icon.png

# Default parameter values
param.field_name = UID
param.data_format = plain

<form class="form-horizontal form-complex">
    <div class="control-group">
        <label class="control-label" for="action_imprintAlert_param_field_name">Field Name</label>
        <div class="controls">
            <input type="text" 
                   name="action.imprintAlert.param.field_name" 
                   id="action_imprintAlert_param_field_name"
                   value="$action.imprintAlert.param.field_name$"
                   placeholder="UID"/>
            <span class="help-block">
                Name of the field to extract from search results (e.g., UID, userID, username, email). Case-insensitive.
            </span>
        </div>
    </div>
    
    <div class="control-group">
        <label class="control-label" for="action_imprintAlert_param_data_format">Data Format</label>
        <div class="controls">
            <select name="action.imprintAlert.param.data_format" 
                    id="action_imprintAlert_param_data_format">
                <option value="plain" $action.imprintAlert.param.data_format|selected("plain")$>
                    Plain (Unencrypted UID)
                </option>
                <option value="encrypted" $action.imprintAlert.param.data_format|selected("encrypted")$>
                    Encrypted (JWE Token)
                </option>
            </select>
            <span class="help-block">
                <strong>Plain:</strong> Field contains plain text identifier (e.g., "019c256a-1ed4-7f58...")<br/>
                <strong>Encrypted:</strong> Field contains JWE token (e.g., "eyJ0eXAi...")
            </span>
        </div>
    </div>
</form>

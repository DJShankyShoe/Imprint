[imprintAlert]
# Python script to execute
alert.execute.cmd = imprintAlert.py
python.version = python3
payload_format = xml

# Make alert action visible in UI
is_custom = 1

# Label shown in UI
label = Imprint Alert

# Description
description = Send alert data to Imprint fingerprint system with configurable field extraction

# Icon (optional - uses default if not specified)
icon_path = alert_icon.png

# Default parameter values
param.field_name = UID
param.data_format = plain

# Imprint service (or use IMPRINT_SERVICE_URL / IMPRINT_ALERT_TOKEN)
param.service_url =
param.token =

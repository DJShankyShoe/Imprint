# SpaceY HTTP (Port 80) - Redirect to HTTPS
<VirtualHost *:80>
    ServerName spacey.ddns.net
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/spacey
    
    # Redirect to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
    
    ErrorLog ${APACHE_LOG_DIR}/spacey_error.log
    CustomLog ${APACHE_LOG_DIR}/spacey_access.log combined
</VirtualHost>

# SpaceY HTTPS (Port 443 for both localhost and domain)
<VirtualHost *:443>
    ServerName spacey.ddns.net
    ServerAlias localhost
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/spacey
    
    <Directory /var/www/spacey>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectorySlash Off
        DirectoryIndex index.php
    </Directory>
    
    # Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Strict-Transport-Security "max-age=31536000"
    
    # Cookie domain isolation - ONLY for domain access, NOT localhost
    # Only set Domain if accessed via spacey.ddns.net
    SetEnvIf Host "spacey.ddns.net" SET_DOMAIN=true
    Header edit Set-Cookie ^(.*)$ "$1; Domain=spacey.ddns.net" env=SET_DOMAIN
    
    ErrorLog ${APACHE_LOG_DIR}/spacey_error.log
    CustomLog ${APACHE_LOG_DIR}/spacey_access.log combined
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/honeypot.crt
    SSLCertificateKeyFile /etc/ssl/private/honeypot.key
    
    <FilesMatch "\.(?:cgi|shtml|phtml|php)$">
        SSLOptions +StdEnvVars
    </FilesMatch>
</VirtualHost>
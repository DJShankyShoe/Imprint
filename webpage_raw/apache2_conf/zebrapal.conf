# Zebrapal HTTP (Port 80) - Redirect to HTTPS
<VirtualHost *:80>
    ServerName zebrapal.local
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/zebrapal
    
    # Redirect to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
    
    ErrorLog ${APACHE_LOG_DIR}/zebrapal_error.log
    CustomLog ${APACHE_LOG_DIR}/zebrapal_access.log combined
</VirtualHost>

# Zebrapal HTTPS (Port 8443 for localhost, 443 for domain)
<VirtualHost *:8443 *:443>
    ServerName zebrapal.local
    ServerAlias localhost
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/zebrapal
    
    <Directory /var/www/zebrapal>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Strict-Transport-Security "max-age=31536000"
    
    # Cookies are host-only by default (works on localhost, an IP or any domain).
    # To share them across subdomains, set your own domain here:
    #SetEnvIf Host "example.com" SET_DOMAIN=true
    #Header edit Set-Cookie ^(.*)$ "$1; Domain=example.com" env=SET_DOMAIN
    
    ErrorLog ${APACHE_LOG_DIR}/zebrapal_error.log
    CustomLog ${APACHE_LOG_DIR}/zebrapal_access.log combined

    # Fingerprint endpoints (one-time slots)
    RewriteEngine On
    RewriteRule ^/endpoints/fp_([a-f0-9]{32})\.php$ /fingerprint_scripts/collect.php?slot=$1 [QSA,L]

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/honeypot.crt
    SSLCertificateKeyFile /etc/ssl/private/honeypot.key
    
    <FilesMatch "\.(?:cgi|shtml|phtml|php)$">
        SSLOptions +StdEnvVars
    </FilesMatch>
</VirtualHost>
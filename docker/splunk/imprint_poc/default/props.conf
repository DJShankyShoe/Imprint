# ModSecurity audit log (one event per entry)
[modsec:audit]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=--[0-9a-f]{8}-A--)
TRUNCATE = 0
TIME_PREFIX = -A--\s+\[
TIME_FORMAT = %d/%b/%Y:%H:%M:%S.%6N
MAX_TIMESTAMP_LOOKAHEAD = 40
TZ = UTC

# Attack type (sqli)
EXTRACT-attack_type = \[tag "attack-(?<attack_type>sqli)"\]

# Session cookie
EXTRACT-imprint_uid = (?m)^Cookie:.*?\bimprint_uid=(?<imprint_uid>[A-Za-z0-9_\-\.]+)

# Client IP and request
EXTRACT-src_ip = -A--\s+\[[^\]]+\]\s+\S+\s+(?<src_ip>\S+)
EXTRACT-request = -B--\s+(?<http_method>[A-Z]+)\s+(?<uri>\S+)

# ZebraPal commands (one JSON per line)
[imprint:commands]
SHOULD_LINEMERGE = false
TIME_PREFIX = "timestamp":"\[
TIME_FORMAT = %d:%b:%Y:%H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 20
TZ = UTC

# Failed logins (one JSON per line)
[imprint:auth]
SHOULD_LINEMERGE = false
KV_MODE = json
TIME_PREFIX = "timestamp":"\[
TIME_FORMAT = %d:%b:%Y:%H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 20
TZ = UTC

# Alert name = attack type (sqli)
[sqli]
search = index=imprint sourcetype=modsec:audit attack_type=sqli imprint_uid=* | dedup imprint_uid | table _time src_ip uri attack_type imprint_uid
description = SQL injection detected by ModSecurity (OWASP CRS) - sends the session to Imprint
enableSched = 1
cron_schedule = * * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = imprint_uid
alert.suppress.period = 5m
action.imprintAlert = 1
action.imprintAlert.param.field_name = imprint_uid
action.imprintAlert.param.data_format = encrypted

# Alert name = attack type (brute_force) - repeated failed logins from one visitor
[brute_force]
search = index=imprint sourcetype=imprint:auth uid=* | stats count BY uid | where count >= 5 | table uid
description = 5+ failed logins from the same visitor in 5 minutes - sends the visitor to Imprint
enableSched = 1
cron_schedule = * * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = uid
alert.suppress.period = 10m
action.imprintAlert = 1
action.imprintAlert.param.field_name = uid
action.imprintAlert.param.data_format = plain

# Alert name = attack type (brute_force_burst) - same thing, machine speed
[brute_force_burst]
search = index=imprint sourcetype=imprint:auth uid=* | stats count BY uid | where count >= 15 | table uid
description = 15+ failed logins from the same visitor in 1 minute - sends the visitor to Imprint
enableSched = 1
cron_schedule = * * * * *
dispatch.earliest_time = -1m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = uid
alert.suppress.period = 10m
action.imprintAlert = 1
action.imprintAlert.param.field_name = uid
action.imprintAlert.param.data_format = plain

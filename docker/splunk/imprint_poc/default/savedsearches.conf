# Alert name = attack type (sqli)
[sqli]
search = index=imprint sourcetype=modsec:audit attack_type=sqli sess_jwe=* | dedup sess_jwe | table _time src_ip uri attack_type sess_jwe
description = SQL injection detected by ModSecurity (OWASP CRS) - sends the session to Imprint
enableSched = 1
cron_schedule = * * * * *
dispatch.earliest_time = -5m
dispatch.latest_time = now
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.digest_mode = 0
alert.suppress = 1
alert.suppress.fields = sess_jwe
alert.suppress.period = 5m
action.imprintAlert = 1
action.imprintAlert.param.field_name = sess_jwe
action.imprintAlert.param.data_format = encrypted
